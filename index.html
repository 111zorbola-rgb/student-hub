 <!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            color: #333;
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(135deg, #1e62ff, #0045e6);
            color: white;
            padding: 25px 20px;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: 0 4px 12px rgba(30, 98, 255, 0.2);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            padding: 20px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #444;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.04);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="number"], select {
            flex: 1;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: #1e62ff;
        }

        .btn-primary {
            background: #1e62ff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #0045e6;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: #f8fafc;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #1e62ff;
            animation: fadeIn 0.2s ease;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        .task-text {
            font-size: 15px;
            color: #334155;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            accent-color: #1e62ff;
            cursor: pointer;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .delete-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
        }
.gpa-form {
         display: flex;
         flex-direction: column;
         gap: 12px;
     }

     .gpa-result {
[6/19/2026 3:16 AM] Samandar: margin-top: 20px;
         padding: 15px;
         border-radius: 12px;
         text-align: center;
         font-weight: 600;
         display: none;
     }

     .bottom-nav {
         position: fixed;
         bottom: 0;
         left: 0;
         right: 0;
         height: 65px;
         background: white;
         display: flex;
         box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
         border-top: 1px solid #edf2f7;
         z-index: 1000;
     }

     .nav-tab {
         flex: 1;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         gap: 4px;
         color: #64748b;
         font-size: 12px;
         font-weight: 500;
         cursor: pointer;
         transition: all 0.2s ease;
     }

     .nav-tab span {
         font-size: 20px;
     }

     .nav-tab.active {
         color: #1e62ff;
         font-weight: 600;
     }

     @keyframes fadeIn {
         from { opacity: 0; transform: translateY(10px); }
         to { opacity: 1; transform: translateY(0); }
     }
 </style>
</head>
<body>

 <div class="header">
     <h1>🎓 Student Hub</h1>
     <p>Talaba aqlli assistenti</p>
 </div>

 <div class="container">
     <!-- VAZIFALAR SAHIFASI -->
     <div id="vazifalar-page" class="page active">
         <h2 class="section-title">📌 Joriy topshiriqlar</h2>

div class="card">
             <div class="input-group">
                 <input type="text" id="task-input" placeholder="Vazifa nomini kiriting...">
                 <button class="btn-primary" id="add-task-btn">+ Qo'shish</button>
             </div>
             <ul class="task-list" id="task-container"></ul>
         </div>
     </div>

     <!-- GPA KALKULYATOR SAHIFASI -->
     <div id="gpa-page" class="page">
         <h2 class="section-title">📊 GPA Kalkulyator</h2>
         <div class="card">
             <div class="gpa-form">
                 <input type="number" id="credit-input" placeholder="Kredit miqdori (masalan: 6)" min="1">
                 <select id="grade-input">
                     <option value="">Bahoni tanlang (Asosiy)</option>
                     <option value="5">5 (A - Alo)</option>
                     <option value="4">4 (B - Yaxshi)</option>
                     <option value="3">3 (C - Qoniqarli)</option>
                     <option value="2">2 (D/F - Qoniqarsiz)</option>
                 </select>
                 <button class="btn-primary" id="add-subject-btn">+ Fan qo'shish</button>
             </div>
             <div class="gpa-result" id="gpa-result-box"></div>
         </div>
     </div>
 </div>

 <!-- PASTKI NAVIGATSIYA -->
 <nav class="bottom-nav">
     <div class="nav-tab active" onclick="switchPage('vazifalar-page', this)">
         <span>📋</span>
         Vazifalar
     </div>
     <div class="nav-tab" onclick="switchPage('gpa-page', this)">
         <span>📊</span>
         GPA
     </div>
 </nav>

 <script>
     // Telegram WebApp sozlash
     const tg = window.Telegram.WebApp;
     tg.expand();

     // Sahifalarni almashtirish funksiyasi
     function switchPage(pageId, tabElement) {
         document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
         document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
         
         document.getElementById(pageId).classList.add('active');
         tabElement.classList.add('active');
     }

     // --- VAZIFALAR LOGIKASI ---
     const taskInput = document.getElementById('task-input');
     const addTaskBtn = document.getElementById('add-task-btn');
     const taskContainer = document.getElementById('task-container');

     addTaskBtn.addEventListener('click', () => {
         const text = taskInput.value.trim();
         if (!text) return;

         const li = document.createElement('li');
         li.className = 'task-item';
         li.innerHTML =

             <div class="task-left" onclick="this.parentElement.classList.toggle('completed')">
                 <input type="checkbox" class="task-checkbox">
[6/19/2026 3:16 AM] Samandar: <span class="task-text">${text}</span>
             </div>
             <button class="delete-btn" onclick="this.parentElement.remove()">🗑️</button>
         
;
         taskContainer.appendChild(li);
         taskInput.value = '';
     });

     // --- GPA LOGIKASI ---
     let totalCredits = 0;
     let totalPoints = 0;

     const creditInput = document.getElementById('credit-input');
     const gradeInput = document.getElementById('grade-input');
     const addSubjectBtn = document.getElementById('add-subject-btn');
     const gpaResultBox = document.getElementById('gpa-result-box');

     addSubjectBtn.addEventListener('click', () => {
         const credit = parseFloat(creditInput.value);
         const grade = parseFloat(gradeInput.value);

         if (!credit || !grade) {
             alert("Iltimos, kredit va bahoni to'g'ri tanlang!");
             return;
         }

         totalCredits += credit;
         totalPoints += (credit * grade);

         const gpa = (totalPoints / totalCredits).toFixed(2);

gpaResultBox.style.display = 'block';
         gpaResultBox.style.background = '#e0f2fe';
         gpaResultBox.style.color = '#0369a1';
         gpaResultBox.innerHTML =
Umumiy kredit: ${totalCredits} | Joriy GPA: ${gpa}
;

         creditInput.value = '';
         gradeInput.value = '';
     });
 </script>
</body>
</html>
